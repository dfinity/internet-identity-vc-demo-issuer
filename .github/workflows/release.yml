name: Release

# Publishes a GitHub Release on `release-*` tags. Internet Identity consumes these
# releases: it pins a tag in `.github/versions/vc-issuer` and downloads the
# assets below, so the asset names are part of the contract and must not change:
#
#   vc_demo_issuer.wasm.gz   the canister module
#   vc_demo_issuer.did       II's `didc bind` codegen input
on:
  push:
    tags: ["release-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap
      - uses: ./.github/actions/setup-node
      - run: npm ci

      - name: "Build VC issuer canister"
        run: ./build.sh

      # One `<asset>.sha256` per asset, matching the convention of the
      # internet-identity releases that consume these.
      - name: "Checksums"
        run: |
          for asset in vc_demo_issuer.wasm.gz vc_demo_issuer.did; do
            shasum -a 256 "$asset" > "$asset.sha256"
            cat "$asset.sha256"
          done

      - name: "Publish release"
        if: startsWith(github.ref, 'refs/tags/release-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            vc_demo_issuer.wasm.gz \
            vc_demo_issuer.wasm.gz.sha256 \
            vc_demo_issuer.did \
            vc_demo_issuer.did.sha256
