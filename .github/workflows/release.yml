name: Release

# Publishes a GitHub Release on `release-*` tags. Internet Identity consumes these
# releases: it pins a tag in `.github/versions/vc-issuer` and downloads the
# assets below, so the asset names are part of the contract and must not change:
#
#   vc_demo_issuer.wasm.gz   the canister module
#   vc_demo_issuer.did       II's `didc bind` codegen input
#   provision                the script II's deploy job runs after installing
on:
  push:
    tags: ["release-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/bootstrap
      - uses: ./.github/actions/setup-node
      - run: npm ci

      - name: "Build VC issuer canister"
        run: ./build.sh

      # Every asset is checksummed, not just the wasm: Internet Identity
      # executes `provision` after downloading it, so it needs to verify that
      # file too.
      - name: "Checksums"
        run: |
          shasum -a 256 vc_demo_issuer.wasm.gz vc_demo_issuer.did provision > SHA256SUMS
          cat SHA256SUMS

      - name: "Publish release"
        if: startsWith(github.ref, 'refs/tags/release-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            vc_demo_issuer.wasm.gz \
            vc_demo_issuer.did \
            provision \
            SHA256SUMS
